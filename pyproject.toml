[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-grounding-proj"
version = "0.1.0"
description = "Learning language grounding with SmolVLA and LIBERO"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
tools = ["uv>=0.10,<1"]
runtime = [
  "lerobot[smolvla,libero,evaluation]==0.6.1; sys_platform == 'linux'",
  "torch==2.10.0; sys_platform == 'linux'",
  "torchvision==0.25.0; sys_platform == 'linux'",
  "torchcodec==0.10.0; sys_platform == 'linux'",
  "hf-libero==0.1.4; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[project.scripts]
vla-author-check = "vla_grounding.authoring:main"
vla-target-check = "vla_grounding.runtime:main"
vla-render-smoke = "vla_grounding.render:main"
vla-fetch-assets = "vla_grounding.assets:main"
vla-policy-smoke = "vla_grounding.smoke:main"
vla-inspect-arrays = "vla_grounding.inspection:main"
vla-run-episode = "vla_grounding.episode:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
